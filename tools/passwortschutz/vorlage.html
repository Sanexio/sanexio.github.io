<!DOCTYPE html>
<html lang="de" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- diese Seite nicht zwischenspeichern -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }
            .staticrypt-body {
                background: #f5f5f7;
                color: #1d1d1f;
                font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-content {
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
                box-sizing: border-box;
                background: radial-gradient(900px 480px at 85% -10%, rgba(200, 22, 29, 0.08), transparent 62%), #f5f5f7;
            }
            .staticrypt-form {
                width: 100%;
                max-width: 24rem;
                box-sizing: border-box;
                background: #fff;
                border: 1px solid #e5e5ea;
                border-radius: 20px;
                padding: 2.25rem 2rem 2rem;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
            }
            .staticrypt-logo {
                display: block;
                height: 2rem;
                width: auto;
                margin: 0 0 1.5rem;
            }
            .staticrypt-title {
                font-size: 1.45rem;
                font-weight: 700;
                letter-spacing: -0.025em;
                margin: 0 0 0.5rem;
            }
            .staticrypt-instructions p {
                margin: 0 0 1.4rem;
                color: #6e6e73;
                font-size: 0.95rem;
                line-height: 1.5;
            }
            .staticrypt-password-container {
                position: relative;
                margin: 0 0 0.9rem;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                font: inherit;
                font-size: 16px;
                padding: 0.85rem 3rem 0.85rem 1rem;
                border: 1px solid #d2d2d7;
                border-radius: 12px;
                background: #fff;
                color: inherit;
                outline: 0;
            }
            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: #c8161d;
                box-shadow: 0 0 0 3px rgba(200, 22, 29, 0.18);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                opacity: 0.55;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }
            .staticrypt-decrypt-button {
                width: 100%;
                min-height: 48px;
                font: inherit;
                font-weight: 650;
                color: #fff;
                background: /*[|template_color_primary|]*/ 0;
                border: 0;
                border-radius: 999px;
                cursor: pointer;
                box-shadow: 0 1px 2px rgba(139, 15, 20, 0.25), 0 6px 16px rgba(200, 22, 29, 0.22);
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus-visible {
                filter: brightness(92%);
            }
            .staticrypt-error {
                margin: 0 0 0.9rem;
                color: #c8161d;
                font-size: 0.9rem;
                font-weight: 600;
            }
            .staticrypt-legal {
                margin-top: 1.25rem;
                font-size: 0.8rem;
                color: #6e6e73;
            }
            .staticrypt-legal a {
                color: inherit;
                margin: 0 0.5rem;
            }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                border: 0.25em solid #c7c7cc;
                border-right-color: transparent;
                border-radius: 50%;
                animation: staticrypt-dreh 0.75s linear infinite;
            }
            @keyframes staticrypt-dreh {
                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-form">
                <img class="staticrypt-logo" src="/logo-sanexio-red.svg" alt="Sanexio" />
                <div class="staticrypt-instructions">
                    <h1 class="staticrypt-title">/*[|template_title|]*/0</h1>
                    <p>/*[|template_instructions|]*/0</p>
                </div>

                <form id="staticrypt-form" action="#" method="post">
                    <div class="staticrypt-password-container">
                        <input
                            id="staticrypt-password"
                            type="password"
                            name="password"
                            placeholder="/*[|template_placeholder|]*/0"
                            aria-label="/*[|template_placeholder|]*/0"
                            autocomplete="current-password"
                            autofocus
                        />
                        <img
                            class="staticrypt-toggle-password-visibility"
                            alt="/*[|template_toggle_show|]*/0"
                            title="/*[|template_toggle_show|]*/0"
                            src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMWQxZDFmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTEgMTJzNC03IDExLTcgMTEgNyAxMSA3LTQgNy0xMSA3UzEgMTIgMSAxMnoiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSIzIi8+PC9zdmc+"
                        />
                    </div>

                    <p id="staticrypt-error" class="staticrypt-error hidden" role="alert"></p>

                    <!-- Merken ist immer an: sonst fragt jede Unterseite und jeder eingebettete Rahmen erneut. -->
                    <label id="staticrypt-remember-label" class="hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" checked />
                        /*[|template_remember|]*/0
                    </label>

                    <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                </form>
            </div>
            <p class="staticrypt-legal"><a href="/impressum/">Impressum</a><a href="/datenschutz/">Datenschutz</a></p>
        </div>

        <script>
            // Diese Variablen füllt StatiCrypt beim Erzeugen – Format '/*[|name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // Gemerktes Passwort: Seite sofort öffnen, sonst Abfrage zeigen
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();
                }
            };

            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                const zeigen = passwordInput.type === "password";
                passwordInput.type = zeigen ? "text" : "password";
                toggleIcon.style.opacity = zeigen ? "1" : "";
                toggleIcon.alt = toggleIcon.title = zeigen ? templateToggleAltHide : templateToggleAltShow;
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const fehler = document.getElementById("staticrypt-error");
                fehler.classList.add("hidden");

                const password = document.getElementById("staticrypt-password").value;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberEnabled);

                if (!isSuccessful) {
                    fehler.textContent = templateError;
                    fehler.classList.remove("hidden");
                    document.getElementById("staticrypt-password").select();
                }
            });
        </script>
    </body>
</html>
