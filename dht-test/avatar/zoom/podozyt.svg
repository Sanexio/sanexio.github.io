<title id="title">Podozyt: Einzelzelle als Schema</title>
<desc id="desc">Eine einzelne verzweigte Zelle mit Zellkern, Zellkörper, Hauptfortsätzen und Fußfortsätzen. Formprinzip nach HuBMAP; Konturen und Anordnung schematisch. Mikrometerbereich, keine Einzelzellmessung. Orange markiert: Region für das getrennte Schlitzdetail.</desc>
<metadata>CC BY 4.0; https://creativecommons.org/licenses/by/4.0/; Formkontext: HuBMAP Consortium / Human Reference Atlas, 2D Reference Object Library v1.0, HRA v1.2, renal_corpuscle_kidney.png. Bearbeitung: Digital Health Twin, 2026. Schema; keine vermessene Zellgeometrie; keine PDB-Koordinaten verwendet.</metadata>
